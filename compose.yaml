# Dev infrastructure. All host ports and the project name come from `.env`, which is generated
# per git worktree by `scripts/dev-env.js`. Start it with `npm run dev:up` (or `npm start`),
# never with a bare `docker compose up` - the defaults below are only a fallback.
# Published ports are bound to 127.0.0.1: the containers run with dev credentials and are meant
# for this machine only.
#
# The `app` profile additionally runs yhub itself in containers:
#   docker compose --profile app up
services:
  valkey:
    image: docker.io/valkey/valkey:alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - valkey:/data
  postgres:
    image: docker.io/library/postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: yhub
      POSTGRES_PASSWORD: yhub
      POSTGRES_DB: yhub
    volumes:
      - postgres:/var/lib/postgresql/data
  s3:
    image: docker.io/rustfs/rustfs:1.0.0
    ports:
      - "127.0.0.1:${S3_PORT:-9010}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9011}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-yhub-dev-access-key}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-yhub-dev-secret-key}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 2s
      retries: 30
    volumes:
      - s3:/data
  server:
    build: .
    profiles: ["app"]
    command: node ./bin/server.js --no-colors
    # SHUTDOWN_DRAIN_MS plus the S3 plugin's delete delay - docker's default of 10s cuts the drain
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${DOCKER_PORT:-4400}:${DOCKER_PORT:-4400}"
    environment:
      PORT: ${DOCKER_PORT:-4400}
    env_file:
      - .env
      - .env.docker
    depends_on:
      - valkey
      - postgres
      - s3
  worker:
    build: .
    profiles: ["app"]
    command: node ./bin/worker.js --no-colors
    # SHUTDOWN_DRAIN_MS plus the S3 plugin's delete delay - docker's default of 10s cuts the drain
    stop_grace_period: 30s
    env_file:
      - .env
      - .env.docker
    depends_on:
      - valkey
      - postgres
      - s3

volumes:
  valkey:
  postgres:
  s3:
